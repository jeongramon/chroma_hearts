[pdf_collector]
count = 500
output_dir = "sample/documents"

[generator]
input_dir = "sample/documents"
output_dir = "sample/chroma_db"
iterations = 20000
add_weight = 2800
search_weight = 100
delete_weight = 200
update_weight = 200
upsert_weight = 200
new_collection_weight = 1
drop_at = 0 # drop the primary collection at this iteration (0 = never)
seed = -1 # random seed for the operation sequence (-1 = unseeded)
sync_threshold = 0 # hnsw sync_threshold for generated collections (0 = Chroma default)

[generator.embedding]
mode = "hash" # "default" | "hash"
dimension = 384

[parser]
output_dir = "sample/report"
